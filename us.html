body{
    margin:0;
    font-family: 'Georgia', serif;

}

/* TITLE */
.title{
    text-align:center;
    margin-top:60px;
    font-size:2em;
    letter-spacing:3px;
}

/* COLLAGE DE POLAROIDS */
.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px; /* menos espacio para que se vean más juntas */
    padding:50px;
    position: relative;
}

/* Cada polaroid con rotación aleatoria */
.polaroid{
    background:white;
    padding:15px 15px 40px 15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.15);
    width:200px;
    transition:.4s;
    position: relative;
}

/* Rotaciones individuales usando variables --i */
.polaroid:nth-child(1) { transform: rotate(-5deg); }
.polaroid:nth-child(2) { transform: rotate(4deg); }
.polaroid:nth-child(3) { transform: rotate(-3deg); }
.polaroid:nth-child(4) { transform: rotate(5deg); }
.polaroid:nth-child(5) { transform: rotate(-2deg); }
.polaroid:nth-child(6) { transform: rotate(-5deg); } /* última tres giran izquierda */
.polaroid:nth-child(7) { transform: rotate(-4deg); }
.polaroid:nth-child(8) { transform: rotate(-6deg); }

.polaroid:hover{
    transform: scale(1.05) rotate(0deg); /* se endereza al pasar el mouse */
    z-index:10;
}

.polaroid img{
    width:100%;
    height:250px;
    object-fit:cover;
}

/* FOOTER TEXT */
.footer-text{
    text-align:center;
    margin:100px 0 60px 0;
    font-style:italic;
    font-size:1.1em;
    opacity:0.8;
}
</style>
</head>
